name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]
  workflow_dispatch:
  # Lets release.yml run this exact workflow as a release gate, so the
  # published artifacts are the ones that were built and tested here.
  workflow_call:

# Supersede in-flight runs for the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the envlist in tox.ini.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # cooked_input reads from the console, so the oldest and newest
        # supported versions also get checked on the other two platforms.
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      # No path: testpaths in pyproject.toml is the single collection root now.
      - name: Run tests
        run: pytest

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"

      # A ratchet, not a target. The floor only ever goes up, and it goes up in
      # the PR that earns the increase -- see CONTRIBUTING.md. Kept out of addopts
      # so it does not slow the eight matrix jobs or every local run.
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-fail-under=99

  types:
    name: types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # The package itself is installed so that ty can resolve prettytable and
      # dateparser; checking against the real dependencies is the point.
      - name: Install package and type-checking dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test,typecheck]"

      # Ruff first: it reports which functions lack annotations, which is the more
      # actionable failure. ty then checks that the annotations that exist are right.
      - name: Check that annotations exist
        run: ruff check --output-format=github

      - name: Check that annotations are correct
        run: ty check --output-format=github

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the python.tools version in /.readthedocs.yaml, so a build that
          # passes here is the build Read the Docs will run.
          python-version: "3.12"
          cache: pip

      - name: Install package and documentation dependencies
        run: python -m pip install --upgrade pip && python -m pip install . -r docs/requirements.txt

      # -W matches the fail_on_warning in /.readthedocs.yaml. Now that
      # sphinx_autodoc_typehints rewrites the parameter fields from the annotations,
      # a malformed docstring is a build failure rather than a rendering oddity --
      # and until this job existed the only signal was Read the Docs, after merge.
      - name: Build the documentation
        run: sphinx-build -b html -W docs docs/_build/html

  build:
    name: build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      # Cheap and dependency-free, so it runs before the build rather than as its
      # own job. Catches the READMEs, pyproject, tox and this matrix disagreeing
      # about which Pythons are supported -- README.md sat a version behind once.
      - name: Check the supported Python range agrees across the project
        run: python scripts/check_version_claims.py

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distribution metadata
        run: twine check dist/*

      - name: Confirm the wheel imports from a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/python -c "import cooked_input; print(cooked_input.__version__)"

      # PEP 561: without this marker inside the *installed* package, a downstream project's
      # type checker ignores our annotations and cooked_input is untyped for everyone but us.
      # It fails silently, so it is asserted rather than assumed.
      - name: Confirm py.typed ships in the installed package
        run: |
          /tmp/clean/bin/python -c "
          import pathlib, cooked_input
          marker = pathlib.Path(cooked_input.__file__).parent / 'py.typed'
          assert marker.is_file(), f'py.typed missing from the installed package at {marker}'
          print(f'py.typed present: {marker}')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/