[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` field below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cooked-input"
description = "Get, clean, convert and validate input."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE.txt"]
keywords = ["command line", "tool development", "input", "raw_input"]
authors = [{ name = "Len Wanger", email = "len_wanger@hotmail.com" }]

# Single source of truth stays cooked_input/version.py; see [tool.setuptools.dynamic].
dynamic = ["version"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]

# Lower bounds, not the hard pins the old requirements.txt used: a library
# should not force an exact version on the applications that depend on it.
# These are the earliest releases cooked_input is known to work against.
dependencies = [
    "prettytable>=3.18.0",
    "dateparser>=1.4.2",
]

[project.optional-dependencies]
# pytest-timeout is the backstop for a test that forgets the fake_input fixture and
# reaches the real getpass; pytest-cov backs the coverage floor checked in CI.
test = ["pytest>=8", "pytest-timeout>=2.3", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/lwanger/cooked_input"
Source = "https://github.com/lwanger/cooked_input"
Documentation = "https://cooked-input.readthedocs.io"

[tool.setuptools.dynamic]
version = { attr = "cooked_input.version.__version__" }

[tool.pytest.ini_options]
minversion = "8.0"
# One collection root. CI passed "cooked_input/", pytest.sh passed
# "cooked_input/tests/" and tox passed nothing, which also let a bare `pytest`
# collect the stale copy of the suite under build/lib/.
testpaths = ["cooked_input/tests"]
addopts = "-ra --strict-markers --strict-config"
norecursedirs = ["build", "dist", "docs", ".git", ".tox", "*.egg-info"]
# An xfail that starts passing must turn the suite red, so that fixing a bug cannot
# leave its marker behind. The bug backlog in TODO.md leans on this.
xfail_strict = true
# The suite runs in seconds; this only ever trips on a test that reached a real
# console read and would otherwise hang the job.
timeout = 60
markers = ["slow: takes more than a second"]
# Safe to turn on now that the whole suite scripts input through fake_input: the
# GetPassWarning that used to come out of every run was the last blocker.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cooked_input"]
branch = true
omit = [
    "cooked_input/tests/*",
    # Demo scripts with __main__ blocks, not library code.
    "cooked_input/examples/*",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    # Cleaner, Convertor and Validator used to declare `__metaclass__ = ABCMeta`, the
    # Python 2 spelling, which is inert on Python 3 -- so these bodies really were
    # reachable and the tests asserted it. Now that the three are real ABCs the bases
    # cannot be instantiated, so an @abstractmethod body is genuinely unreachable.
    "@abstractmethod",
]

[tool.setuptools.packages.find]
# Matches the old find_packages() result: cooked_input and cooked_input.tests.
# cooked_input/examples has no __init__.py, so it is not an importable package;
# its sources reach the sdist through MANIFEST.in instead.
include = ["cooked_input*"]